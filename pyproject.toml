[project]
name = "clihax"
version = "1.1.0"
description = "Command-line reference manager for penetration testers: store, search and recall tool syntax."
authors = [{ name = "Harikrishnan-P97" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
keywords = ["cli", "pentesting", "penetration-testing", "security", "cheatsheet", "command-line", "reference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities"
]

dependencies = [
    "click (>=8.2.1,<9.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "pyperclip (>=1.9.0,<2.0.0)",
    "platformdirs (>=4.0,<4.14)"
]

[project.urls]
Homepage = "https://github.com/Harikrishnan-P97/clihax"
Repository = "https://github.com/Harikrishnan-P97/clihax"
Issues = "https://github.com/Harikrishnan-P97/clihax/issues"
Changelog = "https://github.com/Harikrishnan-P97/clihax/blob/main/CHANGELOG.md"

[project.scripts]
clihax = "clihax.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are common in CLI help text and rich markup.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
