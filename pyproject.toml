[project]
name = "clihax"
version = "1.0.0"
description = "CliHax - A command reference manager for hackers and pentesters."
authors = [{ name = "Lord" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
keywords = ["cli", "hacking", "pentesting", "reference", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: Utilities"
]

dependencies = [
    "click (>=8.2.1,<9.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "pyperclip (>=1.9.0,<2.0.0)",
    "platformdirs (>=4.0,<4.14)"
]

[project.scripts]
clihax = "clihax.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Long lines are common in CLI help text and rich markup.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
